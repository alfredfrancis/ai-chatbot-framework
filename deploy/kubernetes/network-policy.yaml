---
# Sandbox pods (label acf.sandbox=1) take no connections, and reach only cluster DNS and public addresses:
# not other pods or Services, not the nodes or the API server, not private, shared, loopback, link-local
# (cloud metadata at 169.254.169.254), multicast or reserved ranges. The same list as sandbox-firewall.sh.
# No IPv6 is allowed at all. The cluster's network plugin must enforce NetworkPolicy (most do; k3s does
# with its embedded kube-router).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acf-sandbox-ingress
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      acf.sandbox: "1"
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acf-sandbox-egress
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      acf.sandbox: "1"
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
