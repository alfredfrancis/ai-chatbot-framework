{{- /*
A pre-install hook, so that it exists before the migrate Job (also a hook) runs on the first install. Helm
doesn't delete hook objects on uninstall: the Secret, and with it secretKey, outlives the release, so a
reinstall against the same database can still read its secrets. Delete it with kubectl when you are done.
*/ -}}
{{- $data := include "acf.secretData" . | fromYaml -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "acf.fullname" . }}
  labels:
    {{- include "acf.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
