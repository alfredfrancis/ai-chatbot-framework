apiVersion: v1
kind: Service
metadata:
  name: {{ include "acf.fullname" . }}
  labels:
    {{- include "acf.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "acf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
