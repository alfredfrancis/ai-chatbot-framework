# One-command setup:  ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
# Then open http://localhost:8000
name: harbor
services:
  # Builds the sandbox image used for every user's private container, then exits.
  sandbox-image:
    build: ./sandbox
    image: harbor-sandbox:latest
    entrypoint: ["true"]
    restart: "no"

  harbor:
    build: .
    image: harbor:latest
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      HARBOR_LLM_PROVIDER: ${HARBOR_LLM_PROVIDER:-anthropic}
      HARBOR_LLM_MODEL: ${HARBOR_LLM_MODEL:-}
      HARBOR_LLM_BASE_URL: ${HARBOR_LLM_BASE_URL:-}
      HARBOR_LLM_API_KEY: ${HARBOR_LLM_API_KEY:-${ANTHROPIC_API_KEY:-}}
      HARBOR_PUBLIC_URL: ${HARBOR_PUBLIC_URL:-http://localhost:8000}
      HARBOR_ALLOW_SIGNUP: ${HARBOR_ALLOW_SIGNUP:-true}
      HARBOR_SANDBOX: docker
      HARBOR_SANDBOX_IMAGE: harbor-sandbox:latest
      # Sandboxes are started by the host's Docker, so it needs the host path of the data folder.
      HARBOR_SANDBOX_HOST_DATA_DIR: ${PWD}/data
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
