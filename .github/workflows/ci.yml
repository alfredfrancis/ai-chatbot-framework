name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, sqlite]
    name: backend (${{ matrix.db }})
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: acf
          POSTGRES_USER: acf
          POSTGRES_PASSWORD: acf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acf -d acf" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint
        if: matrix.db == 'sqlite'
        working-directory: backend
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Test (includes Docker sandbox tests)
        working-directory: backend
        env:
          ACF_TEST_DB_URL: ${{ matrix.db == 'postgres' && 'postgresql://acf:acf@127.0.0.1:5432/acf' || '' }}
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: acf
          POSTGRES_USER: acf
          POSTGRES_PASSWORD: acf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acf -d acf" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -e "backend[dev]"
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Build web app (tokens + typecheck + bundle)
        working-directory: frontend
        run: npm run build
      - name: Generated tokens.css matches design/tokens.json
        run: git diff --exit-code frontend/src/tokens.css
      - name: Pull sandbox image
        run: docker pull python:3.12-alpine
      - name: End-to-end tests (real Docker sandbox)
        working-directory: frontend
        env:
          CI: "true"
          PYTHON: python
          E2E_SANDBOX: docker
          E2E_DB_URL: postgresql://acf:acf@127.0.0.1:5432/acf
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          POSTGRES_PASSWORD=ci docker compose config -q
          docker compose -f docker-compose.dev.yml config -q
      - name: Build sandbox image
        run: docker build -t acf-sandbox:latest sandbox
      - name: Build app image
        run: docker build -t ai-chatbot-framework:latest .
      - name: Build the dev stack with compose (as developers run it)
        run: docker compose -f docker-compose.dev.yml build
      - name: Smoke test the sandbox image
        run: |
          docker run --rm acf-sandbox:latest sh -c 'python3 --version && node --version && npx --version && uvx --version'
          # agent-browser + Chromium under the same restrictions as a real user sandbox
          docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            -e HOME=/tmp/home acf-sandbox:latest sh -c \
            'agent-browser open "data:text/html,<title>acf-ok</title>" && agent-browser eval document.title | grep acf-ok && agent-browser close'
