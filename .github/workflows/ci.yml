name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint
        working-directory: backend
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Test (includes Docker sandbox tests)
        working-directory: backend
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -e "backend[dev]"
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Build web app (tokens + typecheck + bundle)
        working-directory: frontend
        run: npm run build
      - name: Generated tokens.css matches design/tokens.json
        run: git diff --exit-code frontend/src/tokens.css
      - name: Pull sandbox image
        run: docker pull python:3.12-alpine
      - name: End-to-end tests (real Docker sandbox)
        working-directory: frontend
        env:
          CI: "true"
          PYTHON: python
          E2E_SANDBOX: docker
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t acf-sandbox:latest sandbox
      - name: Build app image
        run: docker build -t ai-chatbot-framework:latest .
      - name: Smoke test the sandbox image
        run: docker run --rm acf-sandbox:latest sh -c 'python3 --version && node --version && npx --version && uvx --version'
